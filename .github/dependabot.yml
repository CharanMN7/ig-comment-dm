version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]

  # The docs site has its own package.json and lockfile.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]

  # Workflows pin each action to a commit SHA, with its version in a comment.
  # This keeps both current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
