name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Worker builds and starts
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-build
        env:
          CLOUDFLARE_API_TOKEN: ""

  integration:
    name: Integration tests
    # A separate job so a PR shows at a glance whether the Worker still
    # behaves end to end, independent of typecheck or unit failures.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Migrations apply with Wrangler's runner
        # The tests below apply migrations through the test pool, which accepts
        # SQL that `wrangler d1 migrations apply` rejects (a last statement with
        # no semicolon, for one). Deploys use Wrangler's runner, so check it on
        # a throwaway local database. Needs no Cloudflare account.
        run: npx wrangler d1 migrations apply DB --local --persist-to "$RUNNER_TEMP/d1"
        env:
          CLOUDFLARE_API_TOKEN: ""

      - name: Worker, D1 and admin panel in workerd, Meta faked
        run: npm run test:integration

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action reads the PR's commit list through the API, which the
    # top-level `contents: read` alone does not allow.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No secrets file committed
        run: |
          if git ls-files --error-unmatch .dev.vars >/dev/null 2>&1; then
            echo "::error file=.dev.vars::.dev.vars is committed. Remove it and rotate every value in it."
            exit 1
          fi
          echo "No .dev.vars in the index."

      - name: No real D1 database id committed
        run: |
          if grep -qE '^\s*database_id\s*=\s*"[0-9a-f]{8}-[0-9a-f]{4}' wrangler.toml; then
            echo "::error file=wrangler.toml::A real database_id is committed. Remove it: Wrangler finds the database by its name."
            exit 1
          fi
          echo "No real database_id in wrangler.toml."
